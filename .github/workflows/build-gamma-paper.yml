name: Build Gamma paper

on:
  push:
    branches:
      - agent/add-martin-lingham-reference

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Build PDF
        working-directory: gamma_prediction/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error gamma_prediction_interval_final.tex
          pdflatex -interaction=nonstopmode -halt-on-error gamma_prediction_interval_final.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: gamma-prediction-paper
          path: gamma_prediction/paper/gamma_prediction_interval_final.pdf
