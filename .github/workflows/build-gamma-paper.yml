name: Build Gamma prediction paper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gamma-paper.yml'
      - 'gamma_prediction/paper/gamma_prediction_interval_final.tex'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: gamma_prediction_interval_final.tex
          working_directory: gamma_prediction/paper
          latexmk_use_xelatex: false
      - name: Commit rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamma_prediction/paper/gamma_prediction_interval_final.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build Gamma prediction paper PDF"
            git push
          fi
