name: Gamma adaptive series check

on:
  push:
    branches:
      - agent/add-martin-lingham-reference
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e gamma_prediction/python pytest
      - name: Run package tests
        run: python -m pytest gamma_prediction/python/tests -q
      - name: Reproduce deterministic paper results
        run: python gamma_prediction/reproduce_paper.py
