name: PAL research examples (MC and RQMC)

on:
  pull_request:
    paths:
      - "odp_paper/**"
      - "odp_paper_origin/**"
      - "tests/test_pal_research_examples.py"
      - ".github/workflows/pal-examples.yml"
  push:
    branches: [main]
    paths:
      - "odp_paper/**"
      - "odp_paper_origin/**"
      - "tests/test_pal_research_examples.py"
      - ".github/workflows/pal-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current PAL main
        run: python -m pip install "git+https://github.com/ProteusLLP/proteusllp-actuarial-library.git@main"
      - name: Install test requirements
        run: python -m pip install pytest
      # The same ODP tests are exercised on a real CuPy runner by PAL's
      # .github/workflows/gpu-tests.yml. The research repository uses hosted
      # CPU runners, while PAL owns the dedicated self-hosted GPU runner.
      - name: Run PAL research models with MC and RQMC
        run: python -m pytest -q tests/test_pal_research_examples.py
      - name: Baseline ODP timing with PAL main
        if: matrix.python-version == '3.13'
        run: python -m odp_paper_origin.model.compare_sampling --sims 131072 --replicates 0

      - name: Install optimized CPU RQMC candidate
        if: matrix.python-version == '3.13'
        run: python -m pip install --no-deps --force-reinstall "git+https://github.com/ProteusLLP/proteusllp-actuarial-library.git@perf/rqmc-cpu-inverse-transforms"

      - name: Compare optimized ODP results and sampling variability
        if: matrix.python-version == '3.13'
        run: |
          python -m odp_paper_origin.model.compare_sampling --sims 131072 --replicate-sims 8192 --replicates 16

      - name: Profile optimized ODP random-number generation and transforms
        if: matrix.python-version == '3.13'
        run: python -m odp_paper_origin.model.profile_sampling --sims 65536 --lines 25
