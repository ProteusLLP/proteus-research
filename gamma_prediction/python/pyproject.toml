[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-prediction"
version = "0.1.0"
description = "Exact frequentist prediction intervals for a two-parameter Gamma distribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gamma_prediction*"]

[tool.setuptools.package-data]
gamma_prediction = [
    "data/*.npz",
    "tables/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
